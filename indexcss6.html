<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f6">
  <title>MM2 Voice Values</title>
  <style>
    :root {
      --background: #f3f4f6;
      --surface: #ffffff;
      --surface-dark: #111827;
      --border: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green: #15803d;
      --red: #dc2626;
      --ad: #e5e7eb;
      --shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.3);
      outline-offset: 2px;
    }

    .page-layout {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) 150px;
      gap: 18px;
      width: min(1280px, calc(100% - 32px));
      margin: 22px auto;
    }

    .main-content {
      min-width: 0;
    }

    .ad-column {
      min-width: 0;
    }

    .page-intro,
    .controls,
    .item-card,
    .empty-state {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .page-intro {
      padding: 28px 23px;
      text-align: center;
    }

    .page-logo {
      display: block;
      width: min(170px, 70%);
      height: auto;
      max-height: 150px;
      margin: 0 auto 18px;
      object-fit: contain;
    }

    .page-intro h1 {
      margin: 0 0 9px;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
    }

    .page-intro p {
      max-width: 680px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.6;
    }

    .ad-box {
      display: flex;
      min-height: 90px;
      align-items: center;
      justify-content: center;
      margin: 18px 0;
      padding: 14px;
      border: 1px dashed #9ca3af;
      border-radius: 6px;
      color: #6b7280;
      background: var(--ad);
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .banner-ad {
      display: block;
      width: 100%;
      max-width: 944px;
      height: 90px;
      margin: 18px auto;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--ad);
      box-shadow: var(--shadow);
    }

    .banner-ad img {
      display: block;
      width: 100%;
      height: 90px;
      object-fit: cover;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .banner-ad:hover img {
      opacity: 0.9;
      transform: scale(1.01);
    }

    .side-ad {
      position: sticky;
      top: 18px;
      min-height: 250px;
      margin: 0 0 18px;
    }

    .side-ad + .side-ad {
      top: 285px;
    }

    .controls {
      padding: 17px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    button,
    .file-label {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 13px;
      border: 1px solid var(--blue);
      border-radius: 5px;
      color: white;
      background: var(--blue);
      cursor: pointer;
      font-weight: bold;
      transition: background 0.15s ease;
    }

    button:hover,
    .file-label:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
    }

    #micButton {
      border-color: #16a34a;
      background: #16a34a;
    }

    #micButton:hover {
      border-color: #15803d;
      background: #15803d;
    }

    #micButton.is-listening {
      border-color: #b91c1c;
      background: #dc2626;
    }

    #resetButton,
    #cancelButton {
      border-color: #6b7280;
      color: #1f2937;
      background: #f9fafb;
    }

    #resetButton:hover,
    #cancelButton:hover {
      background: #e5e7eb;
    }

    #exportButton {
      border-color: #15803d;
      background: #15803d;
    }

    #exportButton:hover {
      background: #166534;
    }

    #importInput {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .search-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 12px;
    }

    .form-field {
      display: grid;
      gap: 6px;
    }

    .form-field label {
      color: #374151;
      font-size: 0.83rem;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    #status {
      min-height: 20px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #count {
      margin: 20px 0 11px;
      color: #374151;
      font-weight: bold;
    }

    #items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .item-card {
      padding: 14px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .item-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      border-color: #6366f1;
    }

    .item-card h2 {
      min-height: 38px;
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .item-type {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 7px;
      border-radius: 4px;
      color: #1e40af;
      background: #dbeafe;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .item-detail {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 6px 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .item-value {
      color: var(--green);
      font-weight: bold;
    }

    .card-actions {
      display: flex;
      gap: 7px;
      margin-top: 12px;
    }

    .card-actions button {
      flex: 1;
      min-height: 34px;
      padding: 0 6px;
      font-size: 0.77rem;
    }

    .card-actions .remove-button {
      border-color: var(--red);
      color: var(--red);
      background: white;
    }

    .card-actions .remove-button:hover {
      color: white;
      background: var(--red);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 35px 20px;
      color: var(--muted);
      text-align: center;
    }

    .voice-bubble {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 20;
      display: grid;
      width: 68px;
      height: 68px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: white;
      background: #9ca3af;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition:
        width 0.2s ease,
        height 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .voice-bubble:hover {
      transform: scale(1.05);
    }

    .voice-bubble.is-listening {
      width: 86px;
      height: 86px;
      background: #16a34a;
      animation: listeningPulse 1.2s infinite ease-in-out;
    }

    .voice-bubble::before,
    .voice-bubble::after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 2px solid transparent;
      border-radius: 50%;
      pointer-events: none;
    }

    .voice-bubble.is-listening::before {
      border-color: rgba(22, 163, 74, 0.32);
      animation: listeningRing 1.4s infinite ease-out;
    }

    .voice-bubble.is-listening::after {
      border-color: rgba(22, 163, 74, 0.18);
      animation: listeningRing 1.4s 0.45s infinite ease-out;
    }

    @keyframes listeningPulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @keyframes listeningRing {
      0% {
        opacity: 0.8;
        transform: scale(0.85);
      }

      100% {
        opacity: 0;
        transform: scale(1.35);
      }
    }

    .site-footer {
      margin-top: 36px;
      padding: 30px 16px;
      color: #d1d5db;
      background: var(--surface-dark);
    }

    .footer-content {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 24px;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .footer-column h2,
    .footer-column h3 {
      margin: 0 0 10px;
      color: white;
    }

    .footer-column p {
      margin: 0;
      color: #9ca3af;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .footer-column a {
      display: block;
      margin: 7px 0;
      color: #93c5fd;
      font-size: 0.9rem;
    }

    .footer-bottom {
      width: min(1180px, calc(100% - 32px));
      margin: 25px auto 0;
      padding-top: 15px;
      border-top: 1px solid #374151;
      color: #9ca3af;
      font-size: 0.8rem;
      text-align: center;
    }

    dialog {
      width: min(460px, calc(100% - 28px));
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
    }

    dialog::backdrop {
      background: rgba(17, 24, 39, 0.55);
    }

    #itemForm {
      padding: 24px;
    }

    #itemForm h2 {
      margin: 0 0 20px;
    }

    #itemForm p {
      margin: 15px 0;
    }

    #itemForm label {
      display: block;
      color: #374151;
      font-weight: bold;
    }

    #itemForm input,
    #itemForm select {
      margin-top: 7px;
    }

    .dialog-actions {
      display: flex;
      gap: 9px;
      margin-top: 20px;
    }

    .dialog-actions button {
      flex: 1;
    }

    @media (max-width: 980px) {
      .page-layout {
        grid-template-columns: 110px minmax(0, 1fr) 110px;
        gap: 12px;
        width: min(100% - 20px, 1280px);
      }

      .side-ad {
        min-height: 180px;
        font-size: 0.7rem;
      }

      .side-ad + .side-ad {
        top: 210px;
      }
    }

    @media (max-width: 760px) {
      .page-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: min(100% - 20px, 700px);
      }

      .main-content {
        grid-column: 1 / -1;
        grid-row: 1;
      }

      .left-ads {
        grid-column: 1;
        grid-row: 2;
      }

      .right-ads {
        grid-column: 2;
        grid-row: 2;
      }

      .side-ad,
      .side-ad + .side-ad {
        position: static;
        min-height: 90px;
        margin: 12px 0 0;
      }
    }

    @media (max-width: 620px) {
      .page-layout {
        width: min(100% - 20px, 700px);
      }

      .page-intro,
      .controls {
        padding: 16px;
      }

      .search-grid {
        grid-template-columns: 1fr;
      }

      .button-row button,
      .button-row .file-label {
        flex: 1 1 calc(50% - 8px);
      }

      #items {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .item-card {
        padding: 10px;
      }

      .item-card h2 {
        font-size: 0.9rem;
      }

      .item-detail {
        display: block;
        line-height: 1.5;
      }

      .page-logo {
        width: min(140px, 65%);
      }

      .banner-ad {
        height: auto;
        aspect-ratio: 944 / 90;
      }

      .banner-ad img {
        height: 100%;
      }

      .voice-bubble {
        right: 16px;
        bottom: 16px;
      }

      .footer-content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .page-layout {
        display: block;
        width: min(100% - 20px, 1180px);
      }

      .main-content {
        width: 100%;
      }

      .ad-column {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
      }

      .left-ads,
      .right-ads {
        margin-top: 10px;
      }

      .side-ad,
      .side-ad + .side-ad {
        min-height: 75px;
        margin: 0;
      }
    }

    @media (max-width: 390px) {
      #items {
        grid-template-columns: 1fr;
      }

      .button-row button,
      .button-row .file-label {
        flex-basis: 100%;
      }
    }
  </style>
</head>

      function loadItems() {

          if (saved) {
            const parsed = JSON.parse(saved);

            if (Array.isArray(parsed)) {
              return parsed
                .map(item => ({
                  name: String(item.name || '').trim(),
                  value:
                    item.value === '' ||
                    item.value == null
                      ? null
                      : Number(item.value),
                  type: item.type || 'Other',
                  image: item.image || ''
                }))
                .filter(item => item.name);
            }
          }
        } catch (error) {

        return starterItems.map(item => ({ ...item }));

      function normalize(text) {
        return String(text || '')
          .toLowerCase()
          .replace(/[’']/g, '')
          .replace(/[^a-z0-9 ]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function compact(text) {
        return normalize(text).replace(/\s/g, '');
      }

      function normalizeSpeech(text) {
        return normalize(text)
          .replace(/\btravelers?\b/g, 'traveler')
          .replace(/\bvampires?\b/g, 'vampire')
          .replace(/\bhollows?\b/g, 'hollow')
          .replace(/\bwinters?\b/g, 'winter')
          .replace(/\bseers?\b/g, 'seer')
          .replace(/\bknives?\b/g, 'knife')
          .replace(/\bguns?\b/g, 'gun')
          .replace(/\bblades?\b/g, 'blade')
          .replace(/\bdaggers?\b/g, 'dagger')
          .replace(/\brevolvers?\b/g, 'revolver')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function removeVoicePrefix(text) {
        return normalizeSpeech(text)
          .replace(
            /^(please\s+)?(show me|find me|find|search for|search|look for|look up|open)\s+/,
            ''
          )
          .trim();
      }

      function levenshtein(first, second) {
        const matrix = Array.from(
          { length: second.length + 1 },
          () => Array(first.length + 1).fill(0)
        );

        for (let row = 0; row <= second.length; row++) {
          matrix[row][0] = row;
        }

        for (let column = 0; column <= first.length; column++) {
          matrix[0][column] = column;
        }

        for (let row = 1; row <= second.length; row++) {
          for (let column = 1; column <= first.length; column++) {
            const cost =
              second[row - 1] === first[column - 1]
                ? 0
                : 1;

            matrix[row][column] = Math.min(
              matrix[row - 1][column] + 1,
              matrix[row][column - 1] + 1,
              matrix[row - 1][column - 1] + cost
            );
          }
        }

        return matrix[second.length][first.length];
      }

      function similarity(first, second) {
        const longest = Math.max(
          first.length,
          second.length
        );

        if (!longest) {
          return 1;
        }

        return 1 -
          levenshtein(first, second) / longest;
      }

      function wordScore(spokenWords, itemWords) {
        if (!spokenWords.length || !itemWords.length) {
          return 0;
        }

        let total = 0;

        for (const itemWord of itemWords) {
          let best = 0;

          for (const spokenWord of spokenWords) {
            best = Math.max(
              best,
              similarity(spokenWord, itemWord)
            );
          }

          total += best;
        }

        return total / itemWords.length;
      }

      function getWeaponMatch(transcript) {
        const spoken = removeVoicePrefix(transcript);
        const spokenNormal = normalizeSpeech(spoken);
        const spokenCompact = compact(spokenNormal);
        const spokenWords =
          spokenNormal.split(' ').filter(Boolean);

        if (!spokenNormal) {
          return null;
        }

        const exact = items.find(item => {
          return normalizeSpeech(item.name) === spokenNormal;
        });

        if (exact) {
          return exact;
        }

        const compactMatch = items.find(item => {
          return compact(normalizeSpeech(item.name)) ===
            spokenCompact;
        });

        if (compactMatch) {
          return compactMatch;
        }

        const contained = items
          .filter(item => {
            const name = normalizeSpeech(item.name);
            const compactName = compact(name);

            return (
              spokenNormal.includes(name) ||
              name.includes(spokenNormal) ||
              spokenCompact.includes(compactName) ||
              compactName.includes(spokenCompact)
            );
          })
          .sort((a, b) => b.name.length - a.name.length);

        if (contained.length) {
          return contained[0];
        }

        let bestItem = null;
        let bestScore = 0;

        for (const item of items) {
          const name = normalizeSpeech(item.name);
          const compactName = compact(name);
          const nameWords =
            name.split(' ').filter(Boolean);

          const score = Math.max(
            similarity(spokenNormal, name),
            similarity(spokenCompact, compactName),
            wordScore(spokenWords, nameWords)
          );

          if (score > bestScore) {
            bestScore = score;
            bestItem = item;
          }
        }

        const minimumScore =
          spokenCompact.length <= 5
            ? 0.84
            : spokenCompact.length <= 10
              ? 0.72
              : 0.58;

        return bestScore >= minimumScore
          ? bestItem
          : null;
      }

      function resetSearch() {
        $('searchInput').value = '';
        $('typeFilter').value = 'all';
        renderItems();

        $('status').textContent = listening
          ? 'Listening… say an item name or “reset”.'
          : 'Showing all items.';
      }

      function handleVoiceCommand(transcript) {
        const spoken = removeVoicePrefix(transcript);
        const command = normalizeSpeech(spoken);

        if (!command) {
          return;
        }

        const now = Date.now();

        if (
          command === lastTranscript &&
          now - lastTranscriptTime < 1200
        ) {
          return;
        }

        lastTranscript = command;
        lastTranscriptTime = now;

        if (
          [
            'reset',
            'show all',
            'show everything',
            'show me everything',
            'clear',
            'all items',
            'reset list'
          ].includes(command)
        ) {
          resetSearch();
          return;
        }

        if (
          [
            'stop',
            'stop listening',
            'stop voice',
            'stop microphone',
            'turn off voice',
            'turn off microphone'
          ].includes(command)
        ) {
          stopVoice();
          return;
        }

        const match = getWeaponMatch(spoken);

        $('searchInput').value = match
          ? match.name
          : spoken;

        $('typeFilter').value = 'all';
        renderItems();

        $('status').textContent = match
          ? 'Showing: ' + match.name
          : 'Searching for: ' + spoken;
      }

      function renderItems() {
        const query = normalize(
          $('searchInput').value
        );

        const type = $('typeFilter').value;

        const filtered = items
          .filter(item =>
            (!query ||
              normalize(item.name).includes(query)) &&
            (type === 'all' || item.type === type)
          )
          .sort((a, b) =>
            a.name.localeCompare(b.name)
          );

        $('count').textContent =
          filtered.length +
          ' item' +
          (filtered.length === 1 ? '' : 's');

        const container = $('items');
        container.replaceChildren();

        if (!filtered.length) {
          const message = document.createElement('p');
          message.className = 'empty-state';
          message.textContent =
            'No matching items. Try another name or say “reset”.';

          container.appendChild(message);
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'item-card';

          const content = document.createElement('div');
          content.className = 'item-content';

          const heading = document.createElement('h2');
          heading.textContent = item.name;

          const typeBadge = document.createElement('span');
          typeBadge.className = 'item-type';
          typeBadge.textContent = item.type || 'Other';

          const typeDetail = document.createElement('p');
          typeDetail.className = 'item-detail';

          const typeLabel = document.createElement('span');
          typeLabel.textContent = 'Type';

          const typeValue = document.createElement('strong');
          typeValue.textContent = item.type || 'Other';

          typeDetail.append(typeLabel, typeValue);

          const valueDetail = document.createElement('p');
          valueDetail.className = 'item-detail';

          const valueLabel = document.createElement('span');
          valueLabel.textContent = 'Value';

          const valueNumber = document.createElement('strong');
          valueNumber.className = 'item-value';

          valueNumber.textContent =
            item.value === null ||
            item.value === '' ||
            !Number.isFinite(Number(item.value))
              ? 'Not entered'
              : Number(item.value).toLocaleString();

          valueDetail.append(valueLabel, valueNumber);

          const actions = document.createElement('div');
          actions.className = 'card-actions';

          const edit = document.createElement('button');
          edit.type = 'button';
          edit.textContent = 'Edit';

          edit.addEventListener('click', () => {
            openDialog(item);
          });

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'remove-button';
          remove.textContent = 'Remove';

          remove.addEventListener('click', () => {
            if (confirm('Remove ' + item.name + '?')) {
              items = items.filter(
                entry => entry.name !== item.name
              );

              saveItems();
              renderItems();
            }
          });

          actions.append(edit, remove);

          content.append(
            heading,
            typeBadge,
            typeDetail,
            valueDetail,
            actions
          );

          card.appendChild(content);
          container.appendChild(card);
        });
      }

            : '';

        $('itemType').value = item
          ? item.type || 'Other'
          : 'Godly';

        $('itemImage').value = item
          ? item.image || ''
          : '';

        $('itemDialog').showModal();
      }

      function playListeningSound() {
        try {
          const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

          if (!AudioContext) {
            return;
          }

          const audioContext = new AudioContext();
          const oscillator =
            audioContext.createOscillator();

          const gain =
            audioContext.createGain();

          oscillator.type = 'sine';
          oscillator.frequency.value = 660;

          gain.gain.setValueAtTime(
            0.0001,
            audioContext.currentTime
          );

          gain.gain.exponentialRampToValueAtTime(
            0.035,
            audioContext.currentTime + 0.02
          );

          gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + 0.16
          );

          oscillator.connect(gain);
          gain.connect(audioContext.destination);

          oscillator.start();
          oscillator.stop(
            audioContext.currentTime + 0.17
          );

          setTimeout(() => {
            audioContext.close();
          }, 250);
        } catch (error) {
          console.warn('Listening sound unavailable.');
        }
      }

      function updateVoiceBubble() {
        const bubble = $('voiceBubble');

        bubble.classList.toggle(
          'is-listening',
          listening
        );

        bubble.setAttribute(
          'aria-label',
          listening
            ? 'Stop voice search'
            : 'Start voice search'
        );

        bubble.title = listening
          ? 'Stop voice search'
          : 'Start voice search';
      }

      function createRecognition() {
        const SpeechRecognition =
          window.SpeechRecognition ||
          window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          return null;
        }

        const instance = new SpeechRecognition();

        instance.lang = 'en-US';
        instance.continuous = false;
        instance.interimResults = false;
        instance.maxAlternatives = 1;

        instance.onstart = () => {
          restarting = false;
          listening = true;

          $('micButton').classList.add('is-listening');
          $('micButton').textContent = 'Stop voice';

          updateVoiceBubble();
          playListeningSound();

          $('status').textContent =
            'Listening… say a weapon name.';
        };

        instance.onresult = event => {
          const result =
            event.results[0][0].transcript.trim();

          if (result) {
            handleVoiceCommand(result);
          }
        };

        instance.onerror = event => {
          if (event.error === 'aborted') {
            return;
          }

          if (event.error === 'no-speech') {
            $('status').textContent =
              'No speech detected. Still listening...';
            return;
          }

          if (event.error === 'not-allowed') {
            listening = false;
            $('micButton').classList.remove(
              'is-listening'
            );
            $('micButton').textContent = 'Start voice';
            updateVoiceBubble();

            $('status').textContent =
              'Microphone permission was denied. Allow microphone access and try again.';
            return;
          }

          if (event.error === 'audio-capture') {
            listening = false;
            $('micButton').classList.remove(
              'is-listening'
            );
            $('micButton').textContent = 'Start voice';
            updateVoiceBubble();

            $('status').textContent =
              'No microphone was found. Check your microphone settings.';
            return;
          }

          $('status').textContent =
            'Voice recognition error: ' +
            event.error +
            '. Still trying to listen.';
        };

        instance.onend = () => {
          recognition = null;

          if (!listening) {
            $('micButton').classList.remove(
              'is-listening'
            );
            $('micButton').textContent = 'Start voice';
            updateVoiceBubble();

            $('status').textContent = 'Voice is off.';
            return;
          }

          if (restarting) {
            return;
          }

          restarting = true;

          clearTimeout(restartTimer);

          restartTimer = setTimeout(() => {
            if (!listening) {
              restarting = false;
              return;
            }

            startRecognitionAgain();
          }, 300);
        };

        return instance;
      }

      function startRecognitionAgain() {
        if (!listening) {
          return;
        }

        recognition = createRecognition();

        if (!recognition) {
          listening = false;
          updateVoiceBubble();

          $('status').textContent =
            'Speech recognition is not supported in this browser.';
          return;
        }

        try {
          recognition.start();
        } catch (error) {
          recognition = null;
          restarting = false;

          clearTimeout(restartTimer);

          restartTimer = setTimeout(
            startRecognitionAgain,
            700
          );
        }
      }

      function startVoice() {
        const SpeechRecognition =
          window.SpeechRecognition ||
          window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          $('status').textContent =
            'Speech recognition is not supported in this browser. Try Chrome.';
          return;
        }

        if (listening) {
          return;
        }

        listening = true;
        startRecognitionAgain();
      }

      function stopVoice() {
        clearTimeout(restartTimer);

        restarting = false;
        listening = false;

        if (recognition) {
          try {
            recognition.abort();
          } catch (error) {
            try {
              recognition.stop();
            } catch (stopError) {}
          }
        }

        recognition = null;

        $('micButton').classList.remove(
          'is-listening'
        );
        $('micButton').textContent = 'Start voice';

        updateVoiceBubble();

        $('status').textContent = 'Voice is off.';
      }

      $('micButton').addEventListener(
        'click',
        () => {
          listening
            ? stopVoice()
            : startVoice();
        }
      );

      $('voiceBubble').addEventListener(
        'click',
        () => {
          listening
            ? stopVoice()
            : startVoice();
        }
      );

      $('resetButton').addEventListener(
        'click',
        resetSearch
      );

      $('searchInput').addEventListener(
        'input',
        renderItems
      );

      $('typeFilter').addEventListener(
        'change',
        renderItems
      );

      $('addButton').addEventListener(
        'click',
        () => openDialog()
      );

      $('cancelButton').addEventListener(
        'click',
        () => $('itemDialog').close()
      );

      $('itemForm').addEventListener(
        'submit',
        event => {
          event.preventDefault();

          const name = $('itemName').value.trim();
          const valueText =
            $('itemValue').value.trim();

          const item = {
            name,
            value:
              valueText === ''
                ? null
                : Number(valueText),
            type: $('itemType').value,
            image: $('itemImage').value.trim()
          };

          if (
            !name ||
            (
              item.value !== null &&
              (
                !Number.isFinite(item.value) ||
                item.value < 0
              )
            )
          ) {
            return;
          }

          const duplicate = items.find(
            existing =>
              normalize(existing.name) ===
              normalize(name)
          );

          if (
            duplicate &&
            normalize(name) !==
            normalize(editingName || '')
          ) {
            if (
              !confirm(
                'An item with that name exists. Replace it?'
              )
            ) {
              return;
            }
          }

          items = items.filter(
            existing =>
              normalize(existing.name) !==
                normalize(editingName || '') &&
              normalize(existing.name) !==
                normalize(name)
          );

          items.push(item);

          saveItems();

          $('itemDialog').close();
          $('searchInput').value = '';

          renderItems();
        }
      );

      $('exportButton').addEventListener(
        'click',
        () => {
          const blob = new Blob(
            [JSON.stringify(items, null, 2)],
            { type: 'application/json' }
          );

          const url =
            URL.createObjectURL(blob);

          const link =
            document.createElement('a');

          link.href = url;
          link.download = 'mm2-values.json';
          link.click();

          URL.revokeObjectURL(url);
        }
      );

      $('importInput').addEventListener(
        'change',
        async event => {
          const file =
            event.target.files &&
            event.target.files[0];

          if (!file) {
            return;
          }

          try {
            const data =
              JSON.parse(await file.text());

            if (
              !Array.isArray(data) ||
              !data.every(
                item =>
                  item &&
                  typeof item.name === 'string'
              )
            ) {
              throw new Error('Invalid format');
            }

            items = data
              .map(item => ({
                name: item.name.trim(),
                value:
                  item.value === '' ||
                  item.value == null
                    ? null
                    : Number(item.value),
                type: item.type || 'Other',
                image: item.image || ''
              }))
              .filter(item => item.name);

            saveItems();
            renderItems();

            $('status').textContent =
              'Imported ' + items.length + ' items.';
          } catch (error) {
            alert(
              'Could not import that file. Choose a JSON array containing item names and optional values, types, and image URLs.'
            );
          }

          event.target.value = '';
        }
      );

      renderItems();
      updateVoiceBubble();
    })();
  </script>
</body>
</html>
